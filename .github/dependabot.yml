version: 2

updates:
  - package-ecosystem: npm
    # The workspaces root: one manifest scan covers shared, server, web, and e2e.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      # One PR a week for everything non-breaking. Majors stay separate so they
      # get reviewed rather than auto-merged.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
