name: Build image

on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "server/**"
      - "web/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build, smoke test, and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      # Build to the local daemon first so the smoke test runs the exact image
      # that would be pushed.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: amber:smoke
          build-args: |
            AMBER_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          set -euo pipefail
          docker run -d --name amber-smoke \
            -e INSECURE_ALLOW_PUBLIC_ACCESS=1 \
            -e DATA_DIR=/data \
            -v "$PWD/smoke-data:/data" \
            amber:smoke
          # Insecure mode binds 127.0.0.1 inside the container, so every probe
          # runs with docker exec rather than against a published port.
          for attempt in $(seq 1 30); do
            if docker exec amber-smoke curl -fsS http://127.0.0.1:8080/healthz; then
              echo
              echo "healthz ok after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "healthz never came up"
              docker logs amber-smoke
              exit 1
            fi
            sleep 2
          done
          docker exec amber-smoke git --version
          docker exec amber-smoke git lfs version
          docker exec amber-smoke sh -c 'command -v 7z || command -v 7za'
          docker logs amber-smoke

      - name: Tear down the smoke container
        if: always()
        run: docker rm -f amber-smoke || true

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AMBER_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
