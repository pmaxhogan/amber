# TrueNAS deployment. The dataset /mnt/alpha/apps/amber is owned by the apps
# user (uid 568) and mounted at /data; the app creates backups/, state/, and
# logs/ inside it on boot.
#
# Cloudflare Tunnel fronts this with amber.maxhogan.dev, and a CF Access app
# enforces SSO. A second CF Access app on amber.maxhogan.dev/git carries a
# Bypass policy so git clients reach HTTP basic auth instead of the SSO page.

services:
  amber:
    image: ghcr.io/pmaxhogan/amber:latest
    container_name: amber
    pull_policy: always
    restart: unless-stopped
    user: "568:568"
    env_file:
      - /mnt/alpha/apps/amber/.env
    volumes:
      - /mnt/alpha/apps/amber:/data
    ports:
      - "8080:8080"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: amber-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      # Label scoped: this sidecar only ever touches containers that opt in,
      # so it cannot restart anything else running on the NAS.
      - --label-enable
      - --cleanup
      - --rolling-restart
      - --interval
      - "120"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
