# Example production deployment. Copy it, change the two paths, and set the
# uid to whoever owns the data directory on your host.
#
# Amber has no login of its own. It expects an authenticating proxy in front of
# it and verifies that proxy's JWT on every request. The reference setup is a
# Cloudflare Tunnel plus a Cloudflare Access application, configured through
# CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD, and CF_ACCESS_ALLOWED_EMAILS in the env
# file below.
#
# If you enable the read-only git remote, give its path a second Access
# application with a Bypass policy. Otherwise git clients hit the SSO page
# instead of the HTTP basic auth the remote expects.

services:
  amber:
    image: ghcr.io/pmaxhogan/amber:latest
    container_name: amber
    pull_policy: always
    restart: unless-stopped
    # Needs to be able to write the data directory. Nothing in the image needs
    # root, so use whichever uid:gid owns that directory on the host.
    user: "1000:1000"
    env_file:
      - /srv/amber/.env
    volumes:
      # Amber creates backups/, state/, and logs/ inside this on first boot.
      - /srv/amber:/data
    ports:
      - "8080:8080"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Auto-updates: the label on the amber service above opts it in to a host-wide
# Watchtower. Run exactly ONE Watchtower per host, outside this file, e.g.
#
#   docker run -d --name watchtower --restart unless-stopped \
#     -v /var/run/docker.sock:/var/run/docker.sock \
#     containrrr/watchtower:latest --label-enable --cleanup --rolling-restart --interval 120
#
# Do not add a watchtower service here. An unscoped Watchtower stops and
# deletes every other Watchtower on the host when it starts, so a per-app
# sidecar breaks auto-updates for every other app on a shared host.
